name: Dependencies

on:
  schedule:
    # Weekly, Monday 06:00 UTC. Outdated checks aren't latency-sensitive;
    # the schedule keeps signal out of the per-PR CI path.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: outdated-${{ github.ref }}
  cancel-in-progress: false

jobs:
  outdated:
    name: cargo outdated (non-blocking)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Informational. Failures here must not block merges.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable as of 2026-07-16

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install cargo-outdated
        run: cargo install --locked cargo-outdated

      - name: cargo outdated --root-deps-only
        # `--root-deps-only` keeps the report focused on dependencies declared
        # in Cargo.toml; transitive churn is noisy and rarely actionable here.
        run: cargo outdated --root-deps-only --exit-code 0
